<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT To-Do</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card">
            <h2>Entrar no IT To-Do</h2>

            <div th:if="${param.error}" class="alert-danger">
                E-mail ou senha inválidos.
            </div>

            <div th:if="${param.logout}" class="alert-danger" style="background-color: #d1fae5; color: #065f46;">
                Você saiu da sessão.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username" class="form-control" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" required />
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
